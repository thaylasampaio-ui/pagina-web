<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog</title>
    <style>
        header {
            background-color: rgba(20, 20, 197, 0.918);
            color: #ffffff;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #ffffff;
            color: rgb(11, 11, 82);
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }

        img {
           width: 80px;
           height: 80px;
        }
        .artigo-auto {
            font-weight: bold;
        }

    </style>
</head>

<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>compartilhar</p>
    </header>
    <main>
        <img src="imagem-blog.png" 
            alt="alguma coisa">
        <div>
            <h2>sla</h2>
            <p>sla</p>
            <p>sla</p>
            <button>❤️ <span>0</span></button>
        </div>

    </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado):botao

    function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySeletor("span");
        texto.textContent++;
    }
</script>
</html>
